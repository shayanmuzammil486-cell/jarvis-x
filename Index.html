<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS X</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .jarvis {
            width: 92%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            letter-spacing: 6px;
            margin-bottom: 10px;
        }

        .status {
            color: #00eaff;
            margin-bottom: 35px;
            font-size: 14px;
            letter-spacing: 3px;
        }

        .arc {
            width: 190px;
            height: 190px;
            border: 4px solid #00eaff;
            border-radius: 50%;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow:
                0 0 20px #00eaff,
                inset 0 0 20px #00eaff;
            animation: pulse 2s infinite;
        }

        .core {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: #00eaff;
            box-shadow: 0 0 35px #00eaff;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }
        }

        .message {
            margin: 35px 0 20px;
            min-height: 50px;
            font-size: 18px;
        }jarvis x1

        button {
            width: 100%;
            padding: 16px;
            border: 2px solid #00eaff;
            border-radius: 12px;
            background: transparent;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:active {
            background: #00eaff;
            color: black;
        }

        .footer {
            margin-top: 25px;
            color: #777;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="jarvis">
jarvis x1
    <h1>JARVIS X</h1>

    <div class="status">
        SYSTEM ONLINE
    </div>

    <div class="arc">
        <div class="core"></div>
    </div>

    <div class="message" id="message">
        Hello. I am JARVIS X.
    </div>

    <button onclick="activateJarvis()">
        ACTIVATE JARVIS
    </button>

    <div class="footer">
        Personal AI Assistant • V1 Prototype
    </div>

</div>

<script>
    function activateJarvis() {

        const message = document.getElementById("message");

        message.innerText = "JARVIS X is ready.";

        if ("speechSynthesis" in window) {
            const speech = new SpeechSynthesisUtterance(
                "JARVIS X is ready."
            );

            speech.rate = 0.9;
            speech.pitch = 0.8;

            window.speechSynthesis.speak(speech);
        }
    }
</script>

</body>
</html>
